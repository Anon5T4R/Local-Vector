[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["libs"]
default-members = ["crates/*", "apps/localvector", "apps/localvector-cli", "xtask"]

[workspace.package]
version = "0.21.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Anon5T4R/Local-Vector"

[workspace.dependencies]
craft-pdf = { path = "libs/craft-libs/crates/pdf/", default-features = false, features = ["interpret", "write"] }
craft-print = { path = "libs/craft-libs/crates/print/" }
craft-docpath = { version = "0.1.0", path = "libs/craft-libs/crates/docpath/" }
craft-ui = { path = "libs/craft-libs/crates/ui/", features = ["serde"] }
craft-keymap = { path = "libs/craft-libs/crates/keymap/" }
# Decides who draws the window frame (desktop vs. app) so the suite shares one native titlebar per
# desktop. The `egui` feature adds `craft_window::decorate`. (craft-libs#217.)
craft-window = { path = "libs/craft-libs/crates/window/", features = ["egui"] }
# The `.vectorcraft` envelope: its members, version, embedded images and the data after the JSON.
craft-vectorcraft-format = { path = "libs/craft-libs/crates/vectorcraft-format/" }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { version = "=0.1.0", path = "libs/craft-libs/crates/update/", features = ["egui"] }
# internal
localvector-geom = { path = "crates/geom" }
localvector-color = { path = "crates/color" }
localvector-doc = { path = "crates/doc" }
localvector-pathops = { path = "crates/pathops" }
localvector-brush = { path = "crates/brush" }
localvector-trace = { path = "crates/trace" }
# Without its default `bundled-fonts`: a crate that wants the fonts asks for them (the apps and
# localvector-testkit through the engine's `bundled-fonts`), so a library crate never forces them on
# an embedder that supplies its fonts at run time.
localvector-text = { path = "crates/text", default-features = false }
localvector-effects = { path = "crates/effects" }
localvector-three-d = { path = "crates/three-d" }
localvector-render = { path = "crates/render" }
localvector-svg = { path = "crates/svg" }
localvector-pdf = { path = "crates/pdf" }
localvector-format = { path = "crates/format" }
localvector-tools = { path = "crates/tools" }
# Without its default `bundled-fonts`, as localvector-text: each crate that wants the fonts asks for
# them, so an embedder can build without them (docs/development.md › Leaving out the bundled fonts).
localvector-engine = { path = "crates/engine", default-features = false }
localvector-ui-egui = { path = "crates/ui-egui" }
localvector-mcp = { path = "crates/mcp" }
localvector-testkit = { path = "crates/testkit" }
localvector-cad = { path = "crates/cad" }
localvector-eps = { path = "crates/eps" }
localvector-metafile = { path = "crates/metafile" }
localvector-plugins = { path = "crates/plugins" }
localvector-affinity = { path = "crates/affinity" }
localvector-scriptcheck = { path = "crates/scriptcheck" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
peniko = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
crc32fast = "1.5"
# tests: a TCP port bound without listening (connections to it are refused)
socket2 = "0.6"
# Sandboxed WebAssembly plug-ins: a pure-Rust interpreter (MIT OR Apache-2.0) that builds for wasm32
# too. Without `wat` (text parsing is test-only) and memory64; `validate` keeps full module
# validation on; the portable dispatcher can't overflow the host stack on long-running modules.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
# Tests: WebAssembly text -> binary for the plug-in fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# rendering / formats
# Without `text` (glyph runs, through glifo and a second skrifa): the renderer draws the outlines
# localvector-text gives it. The other default features stay.
vello_cpu = { version = "0.2", default-features = false, features = ["std", "png", "u8_pipeline", "f32_pipeline"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp", "tga"] }
# Without `text` and the system fonts (fontdb, harfrust and skrifa, at other versions than ours):
# SVG import reads `<text>` from the XML itself and never gives usvg a font. A test of the SVG
# crate turns `text` on.
usvg = { version = "0.48", default-features = false, features = ["svgz"] }
# Without `simple-text` (its text shaping, the only user of rustybuzz and ttf-parser, which are
# unmaintained, #1730): the PDF writer places glyphs itself. A test of the PDF crate turns it on.
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
skrifa = "0.47"
harfrust = "0.13"
linesweeper = "0.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustix = { version = "1.1", default-features = false }
# Zstandard decoder (pure Rust, builds for wasm32 too): the editing copy an EPS carries of its art.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# CCITT Group 3 and Group 4 decoder (ITU-T T.4 and T.6): EPS images read through
# `CCITTFaxDecode`. The PDF reader's hayro-syntax uses the same version.
hayro-ccitt = "0.3"
# Substring search for the EPS reader's PostScript `search`.
memchr = "2"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
# CMYK image samples (localvector-doc's cmyk module): the image crate's own TIFF and JPEG
# decoders, read directly (the image crate converts CMYK to RGB).
tiff = "0.11"
zune-jpeg = "0.5"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
clipboard-win = "5.4"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
# LocalVector never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Workspace crates keep line tables, so panics and backtraces name file and line; dependencies
# carry no debug info. Full debug info would make the dev target dir several times larger.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
hayro-syntax = { path = "libs/craft-libs/vendor/hayro-syntax" }
hayro-interpret = { path = "libs/craft-libs/vendor/hayro-interpret" }
hayro-jbig2 = { path = "libs/craft-libs/vendor/hayro-jbig2" }
hayro-cmap = { path = "libs/craft-libs/vendor/hayro-cmap" }
hayro-postscript = { path = "libs/craft-libs/vendor/hayro-postscript" }
# The PDF writer takes craft-libs#417 (CMYK, gray and spot colors keep their exact inks).
krilla = { path = "libs/craft-libs/vendor/krilla" }
# The egui and winit crates resolve from the vendored forks under libs/ (path sources;
# egui 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
