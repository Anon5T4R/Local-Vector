[package]
name = "localvector-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalVector tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
localvector-geom = { workspace = true }
localvector-color = { workspace = true }
localvector-doc = { workspace = true }
localvector-brush = { workspace = true }
localvector-pathops = { workspace = true }
localvector-effects = { workspace = true }
localvector-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
localvector-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
