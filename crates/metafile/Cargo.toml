[package]
name = "localvector-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LocalVector Windows metafiles: hand-written EMF and WMF writers and readers"

[lints]
workspace = true

[dependencies]
localvector-geom = { workspace = true }
localvector-color = { workspace = true }
localvector-doc = { workspace = true }
localvector-effects = { workspace = true }
localvector-brush = { workspace = true }
localvector-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
localvector-text = { workspace = true, features = ["bundled-fonts"] }
